(function(){
  'use strict';
  var API='https://livehuay.netlify.app';
  var GUARD={hanoi_normal:'18:30',hanoi_vip:'19:30',hanoi_development:'19:30'},DELAY=7*60e3,STABLE=3*60e3,seen={},LOADED=Date.now();
  function bkk(){var p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});return p.year+'-'+p.month+'-'+p.day;}
  function drawMs(date,hm){return Date.parse(date+'T'+hm+':00+07:00');}
  function isSpin(v){var s=String(v==null?'':v).replace(/\D/g,'');if(s.length<5)return false;for(var i=1;i<s.length;i++)if(+s[i]!==(+s[i-1]+1)%10)return false;return true;}
  function guard(d){
    var res=d&&d.results;if(!res||typeof res!=='object')return;
    var now=Date.now(),date=bkk();
    Object.keys(res).forEach(function(k){var r=res[k];if(!r||r.manual)return;
      var f=['rawSpecial','rawResult','rawFirst','rawSecond'].filter(function(x){return isSpin(r[x]);})[0];
      if(f)res[k]=Object.assign({},r,{pending:true,top:'',bottom:''});});

      var row=res[k];if(!row||row.manual)return;
      var v=(row.ok&&!row.pending&&row.top&&row.bottom&&(row.resultDate||date)===date)?row.top+'-'+row.bottom:'';
      var s=seen[k],draw=drawMs(date,GUARD[k]);
      if(!s||s.date!==date||s.v!==v){
        var late=!s&&LOADED>draw+30*60e3;   /* เปิดหน้าหลังออกผลนานแล้ว = ถือว่านิ่ง */
        s=seen[k]={date:date,v:v,since:late?now-STABLE:now};
      }
      if(!v||now<draw)return;
      if(s.released===v)return;
      if(now>=draw+DELAY&&now-s.since>=STABLE){s.released=v;return;}
      res[k]=Object.assign({},row,{pending:true,top:'',bottom:''});
    });
  }
  var of=window.fetch.bind(window);
  window.fetch=function(input,init){
    var url=typeof input==='string'?input:(input&&input.url)||'';
    if(typeof input==='string'&&input.indexOf('/api/')===0){
      var p=of(API+input,init);
      if(input.indexOf('/api/results')===0){
        return p.then(function(r){return r.clone().json().then(function(d){guard(d);
          return new Response(JSON.stringify(d),{status:r.status,headers:{'content-type':'application/json'}});}).catch(function(){return r;});});
      }
      return p;
    }
    return of(input,init);
  };

.card:nth-child(3n+2)::after{animation-delay:1.6s}

.card:nth-child(4n+1)::after{animation-delay:4.6s}
@keyframes luxeCardSweep{0%,62%{transform:translateX(-160%) skewX(-16deg)}100%{transform:translateX(400%) skewX(-16deg)}}
.card>.head,.card>.results,.card>.adjust,.card>.stock-close-row,.card>.lao-live-result-grid,.card>.live-only-actions,.card>.source{position:relative;z-index:1}

.board.luxe-enter .card{animation:luxeCardIn .7s cubic-bezier(.2,.8,.25,1) backwards}
.board.luxe-enter .card:nth-child(2){animation-delay:.05s}

.board.luxe-enter .card:nth-child(4){animation-delay:.15s}
.board.luxe-enter .card:nth-child(5){animation-delay:.20s}
.board.luxe-enter .card:nth-child(6){animation-delay:.25s}
.board.luxe-enter .card:nth-child(7){animation-delay:.30s}
.board.luxe-enter .card:nth-child(8){animation-delay:.35s}
.board.luxe-enter .card:nth-child(9){animation-delay:.40s}
.board.luxe-enter .card:nth-child(10){animation-delay:.45s}
.board.luxe-enter .card:nth-child(n+11){animation-delay:.50s}

/* ---------- ช่องผลรางวัล ---------- */

/* ---------- เครื่องเล่นลอย ---------- */
.media-dock-v142{

/* ===== V156: ใกล้เวลาผลออก 5 นาที -> ช่องผลหมุน "กำลังออกผล" ===== */
.result.luxe-drawing{color:transparent !important;text-shadow:none !important;font-size:0 !important;
  background:linear-gradient(110deg,rgba(0,0,0,.40) 30%,rgba(255,215,106,.28) 50%,rgba(0,0,0,.40) 70%) !important;

  box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 16px rgba(255,196,48,.55) !important;
  animation:luxeWait 1.4s linear infinite,luxeGlow 1.4s ease-in-out infinite alternate}
.result.luxe-drawing::before{
  content:"";position:absolute;left:50%;top:50%;width:var(--rs,26px);height:var(--rs,26px);margin:calc(var(--rs,26px)/-2) 0 0 calc(var(--rs,26px)/-2);
  border-radius:50%;border:3px solid rgba(255,215,106,.25);border-top-color:#ffd76a;border-right-color:#ffd76a;

.result.luxe-drawing::after{
  display:block !important;content:"กำลังออกผล";position:absolute;left:0;right:0;bottom:3px;top:auto;height:auto;
  font:800 10px/1 Anuphan,sans-serif;color:#ffe9a6;text-align:center;letter-spacing:.2px;

.result.luxe-drawing.luxe-big::before{--rs:40px}

@keyframes luxeSpinRing{to{transform:rotate(360deg)}}

@media(prefers-reduced-motion:reduce){.result.luxe-drawing,.result.luxe-drawing::before,.result.luxe-drawing::after{animation:none !important}}

const DEFAULT_SITE_THEME_V112={
  bg:'#250000',
  primary:'#b40000',

  accent:'#ff6262',

function safeThemeColorV112(value,fallback){
  const v=String(value||'').trim();

  return /^#[0-9a-f]{6}$/i.test(v)
    ? v
    : fallback;
}

function applySiteThemeV112(theme){
  const t={
    ...DEFAULT_SITE_THEME_V112,
    ...(theme||{})
  };

  const root=document.documentElement;

  root.style.setProperty(
    '--theme-bg',
    safeThemeColorV112(t.bg,DEFAULT_SITE_THEME_V112.bg)
  );
  root.style.setProperty(
    '--theme-primary',
    safeThemeColorV112(t.primary,DEFAULT_SITE_THEME_V112.primary)
  );
  root.style.setProperty(
    '--theme-dark',
    safeThemeColorV112(t.dark,DEFAULT_SITE_THEME_V112.dark)
  );
  root.style.setProperty(
    '--theme-card',
    safeThemeColorV112(t.card,DEFAULT_SITE_THEME_V112.card)
  );
  root.style.setProperty(
    '--theme-card-dark',
    safeThemeColorV112(t.cardDark,DEFAULT_SITE_THEME_V112.cardDark)
  );
  root.style.setProperty(
    '--theme-accent',
    safeThemeColorV112(t.accent,DEFAULT_SITE_THEME_V112.accent)
  );
  root.style.setProperty(
    '--theme-result',
    safeThemeColorV112(t.result,DEFAULT_SITE_THEME_V112.result)
  );
  root.style.setProperty(
    '--theme-text',
    safeThemeColorV112(t.text,DEFAULT_SITE_THEME_V112.text)
  );
}

const SITE_MESSAGES_V129={

function applySiteMessagesV129(value){
  const v=value||{};

  SITE_MESSAGES_V129.tickers=
    v.tickers && typeof v.tickers==='object'
      ? {...v.tickers}
      : {};

  SITE_MESSAGES_V129.footer=
    String(v.footer||'').trim();

  const footer=
    document.getElementById('footerMessageText');

  if(
    footer &&
    SITE_MESSAGES_V129.footer
  ){
    footer.textContent=
      SITE_MESSAGES_V129.footer;
  }

  try{
    setTickerForBoard();
  }catch{}
}

function formatMarketNumberV129(value){
  const n=Number(value);

  if(!Number.isFinite(n)){
    return '--';
  }

  return n.toLocaleString(
    'en-US',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}

function renderLiveMarketRowV129(key,row){
  const title=document.getElementById('market-title-'+key);
  const current=document.getElementById('market-current-'+key);
  const change=document.getElementById('market-change-'+key);
  const percent=document.getElementById('market-percent-'+key);
  const prev=document.getElementById('market-prev-'+key);
  const updated=document.getElementById('market-updated-'+key);
  const move=document.getElementById('market-move-'+key);

  if(!current){
    return;
  }

  if(
    !row ||
    row.ok===false ||
    !Number.isFinite(Number(row.current))
  ){
    // V132:
    // ถ้ารอบ refresh ใหม่พลาด อย่าล้างค่าที่แสดงอยู่
    // ถ้ายังไม่เคยมีข้อมูลเลยค่อยแสดง "--"
    if(
      !current.dataset.hasValueV132
    ){
      current.textContent='--';

      if(change) change.textContent='--';
      if(percent) percent.textContent='--';
      if(prev) prev.textContent='--';

      if(updated){
        updated.textContent='--';
      }
    }

    return;
  }

  const currentNumber=Number(row.current);
  const changeNumber=Number(row.change);
  const percentNumber=Number(row.percent);
  const prevNumber=Number(row.previousClose);

  if(title){
    title.textContent=
      row.label ||
      state[key]?.name ||
      key;
  }

  current.textContent=
    formatMarketNumberV129(
      currentNumber
    );

  current.dataset.hasValueV132='1';

  if(change){
    change.textContent=
      Number.isFinite(changeNumber)
        ? (
            (changeNumber>=0?'+':'') +
            formatMarketNumberV129(changeNumber)
          )
        : '--';
  }

  if(percent){
    percent.textContent=
      Number.isFinite(percentNumber)
        ? (
            (percentNumber>=0?'+':'') +
            percentNumber.toFixed(2) +
            '%'
          )
        : '--';
  }

  if(prev){
    prev.textContent=
      Number.isFinite(prevNumber)
        ? formatMarketNumberV129(prevNumber)
        : '--';
  }

  if(updated){
    updated.textContent=
      row.stale===true
        ? 'ข้อมูลล่าสุดที่ดึงได้'
        : (
            row.updatedText
              ? String(row.updatedText)
              : 'อัปเดตล่าสุด'
          );
  }

  if(move){
    move.className=
      'market-move-v129 ' +
      (
        Number.isFinite(changeNumber)
          ? (
              changeNumber>=0
                ? 'up'
                : 'down'
            )
          : ''
      );
  }
}

let LIVE_MARKET_BUSY_V129=false;

function refreshLiveMarketsV129(){
  if(
    LIVE_MARKET_BUSY_V129 ||
    document.hidden ||
    !Array.isArray(MANUAL_STOCK_KEYS) ||
    !MANUAL_STOCK_KEYS.length
  ){
    return;
  }

  LIVE_MARKET_BUSY_V129=true;

  const keys=
    MANUAL_STOCK_KEYS
      .filter(function(key){
        const item=
          ITEMS.find(x=>x.key===key);

        return item && item.mode==='custom';
      });

  if(!keys.length){
    LIVE_MARKET_BUSY_V129=false;
    return;
  }

  fetch(
    '/api/market-live-v135?keys='+
    encodeURIComponent(keys.join(',')),
    {
      cache:'no-store'
    }
  )
  .then(function(r){
    return r.json();
  })
  .then(function(data){
    const rows=
      data &&
      data.rows
        ? data.rows
        : {};

    keys.forEach(function(key){
      renderLiveMarketRowV129(
        key,
        rows[key]
      );
    });
  })
  .catch(function(err){
    console.error(
      'market-live-v129',
      err
    );
  })
  .finally(function(){
    LIVE_MARKET_BUSY_V129=false;
  });
}

function loadServerSettings(){
  fetch('/api/settings',{cache:'no-store'})
    .then(r=>r.json())
    .then(function(res){
      const saved=(res&&res.settings)||{};
      const stockUrls=saved.market_live_urls_v129||{};
      applySiteMessagesV129(saved.site_messages_v129||{});

      applySiteThemeV112(saved.site_theme||{});

      ITEMS.forEach(function(item){
        const savedItem=saved[item.key];

        if(savedItem){
          const mustMatchVersion=!!item.layoutVersion;
          const sameVersion=savedItem._layoutVersion===item.layoutVersion;

          if(!mustMatchVersion||sameVersion){
            state[item.key]=Object.assign({},deepCopy(item),savedItem);

            if(!Array.isArray(state[item.key].boxes)){
              state[item.key].boxes=deepCopy(item.boxes);
            }
          }else{
            state[item.key]=deepCopy(item);
          }
        }

        // V147: การ์ดลาวพัฒนาในรอบดึกเป็นสำเนาหน้าจอขนาดปกติ
        // ใช้ URL LIVE จากหน้าลาวพัฒนาเดิม แต่ไม่แชร์ layout/config กัน
        if(item.mirrorSettingsKey){
          const sourceSaved=saved[item.mirrorSettingsKey];
          const mirroredUrl=String(sourceSaved?.liveUrl||'').trim();
          if(/^https?:\/\//i.test(mirroredUrl)){
            state[item.key].url=mirroredUrl;
          }
        }

        if(
          stockUrls[item.key] &&
          /^https?:\/\//i.test(String(stockUrls[item.key]))
        ){
          state[item.key].url=String(stockUrls[item.key]).trim();
        }

        applyAll(item.key);
      });

      serverLoaded=true;
      showSaveStatus('โหลดค่าจาก Netlify แล้ว',true);
    })
    .catch(function(err){
      serverLoaded=true;
      showSaveStatus('โหลดค่าจาก Netlify ไม่สำเร็จ',false);
      console.error(err);
    });
}

function showSaveStatus(text, ok){
  let el = document.getElementById('serverSaveStatus');
  if(!el){
    el = document.createElement('div');
    el.id = 'serverSaveStatus';
    el.style.cssText =
      'position:fixed;right:14px;bottom:14px;z-index:99999;' +
      'padding:9px 13px;border-radius:999px;font-weight:800;font-size:12px;' +
      'box-shadow:0 6px 20px rgba(0,0,0,.28);transition:.2s';
    document.body.appendChild(el);
  }

  el.textContent = text;
  el.style.background = ok ? '#16a34a' : '#b91c1c';
  el.style.color = '#fff';
  el.style.opacity = '1';

  clearTimeout(window.__saveToastTimer);
  window.__saveToastTimer = setTimeout(function(){
    el.style.opacity = '0';
  }, 2200);
}

function screenshotUrl(url, fullPage){
  // เว็บทั่วไปใช้ภาพ crop ตามเดิม
  // stocks-vip.com ใช้ fullpage เพื่อให้เลื่อนลงได้จริง ไม่เจอพื้นที่ขาว
  const base = 'https://image.thum.io/get/maxAge/0/wait/5/width/1200/';
  return base + (fullPage ? 'fullpage/' : 'crop/1200/') + url;
}

function effectiveStockPreviewUrlV123(key,url){
  const clean=String(url||'').trim();
  if(!clean) return '';

  // Nikkei หน้า root โดน Cloudflare ตอน screenshot
  // ใช้หน้า official profile ของ Nikkei 225 แทนสำหรับ "ภาพ preview" เท่านั้น
  // ชื่อหวย/ลิงก์ต้นทางยังใช้ URL ที่ตั้งจากหลังบ้านได้เหมือนเดิม
  if(
    (key==='nikkei' || key==='nikkei_pm') &&
    /^https?:\/\/indexes\.nikkei\.co\.jp\/en\/nkave\/?(?:\?.*)?$/i.test(clean)
  ){
    return "https://indexes.nikkei.co.jp/en/nkave/index/profile?idx=nk225";
  }

  // HSI /eng บางครั้งตอบ 404 กับ screenshot service
  // ใช้หน้า root สำหรับ preview แต่ลิงก์ชื่อหวยยังเปิด URL ที่ตั้งในหลังบ้าน
  if(
    (key==='hsi' || key==='hsi_pm') &&
    /^https?:\/\/(?:www\.)?hsi\.com\.hk\/eng\/?(?:\?.*)?$/i.test(clean)
  ){
    return "https://www.hsi.com.hk/";
  }

  return clean;
}

function googleFinanceStableUrlV128(key,url){
  const clean=String(url||'').trim();

  if(key==='taiwan'){
    return "https://www.google.com/finance/beta/quote/IX0001:TPE?hl=en";
  }

  if(key==='korea'){
    return "https://www.google.com/finance/beta/quote/KOSPI:KRX?hl=en";
  }

  if(key==='singapore'){
    return "https://finance.yahoo.com/quote/%5ESTI/";
  }

  return clean;
}

function stockPreviewUrlV121(key,url){
  let clean=effectiveStockPreviewUrlV123(key,url);
  if(!clean) return '';

  // V128:
  // Taiwan / Korea ใช้ Google Finance; Singapore V149 ใช้ Yahoo STI (^STI)
  // และใช้ URL canonical เพื่อลด layout เปลี่ยนเพราะ query tracking
  if(
    key==='taiwan' ||
    key==='korea' ||
    key==='singapore'
  ){
    clean=googleFinanceStableUrlV128(key,clean);
  }

  const bucket=Math.floor(Date.now()/300000);

  // Google Finance รอ render นานกว่าหน้าอื่นเล็กน้อย
  const waitSeconds=
    (
      key==='taiwan' ||
      key==='korea' ||
      key==='singapore'
    )
      ? 8
      : 5;

  return (
    'https://image.thum.io/get/noanimate/png/maxAge/0/wait/' +
    waitSeconds +
    '/width/1200/crop/1200/' +
    '?url=' + encodeURIComponent(clean) +
    '&_livehuay=' + bucket
  );
}

function escapeAttrV142(value){
  return String(value==null?'':value)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function youtubeInfoV142(rawUrl){
  const raw=String(rawUrl||'').trim();
  if(!raw) return null;

  let u;
  try{
    u=new URL(raw,location.href);
  }catch(e){
    return null;
  }

  const host=u.hostname.toLowerCase().replace(/^www\./,'');
  const isYoutube=
    host==='youtube.com' ||
    host==='m.youtube.com' ||
    host==='music.youtube.com' ||
    host==='youtu.be' ||
    host==='youtube-nocookie.com';

  if(!isYoutube) return null;

  let video='';
  let list=String(u.searchParams.get('list')||'').trim();

  if(host==='youtu.be'){
    video=u.pathname.split('/').filter(Boolean)[0]||'';
  }else{
    const parts=u.pathname.split('/').filter(Boolean);
    if(parts[0]==='watch') video=String(u.searchParams.get('v')||'').trim();
    else if(['embed','shorts','live'].includes(parts[0])) video=parts[1]||'';
    else if(parts[0]==='playlist') video='';
  }

  video=video.replace(/[^A-Za-z0-9_-]/g,'');
  list=list.replace(/[^A-Za-z0-9_-]/g,'');

  if(!video && !list) return null;
  return {video,list};
}

function isYouTubeUrlV142(rawUrl){
  return !!youtubeInfoV142(rawUrl);
}

function iframeEmbedUrlV142(rawUrl, autoplay){
  const raw=String(rawUrl||'').trim();
  const y=youtubeInfoV142(raw);
  if(!y) return raw;

  const params=new URLSearchParams();
  params.set('playsinline','1');
  params.set('rel','0');
  params.set('enablejsapi','1');
  params.set('fs','0');

  // V144: เล่นซ้ำอัตโนมัติเมื่อ YouTube จบคลิป
  params.set('loop','1');

  if(autoplay) params.set('autoplay','1');

  if(y.video){
    // YouTube ต้องมี playlist=<video id> สำหรับวิดีโอเดี่ยวจึงจะ loop ได้
    params.set('playlist', y.list || y.video);
    if(y.list) params.set('list',y.list);
    return 'https://www.youtube.com/embed/'+encodeURIComponent(y.video)+'?'+params.toString();
  }

  // playlist-only URL: loop ทั้ง playlist
  if(y.list) params.set('list',y.list);
  return 'https://www.youtube.com/embed/videoseries?'+params.toString();
}

        : screenshotUrl(x.url, x.key === 'hsi_vip');

      id="frame-${x.key}"

    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>`;
}

function applyFrame(key){
  const c = state[key], f = document.getElementById('frame-' + key);
  if(!f) return;

  if(c.mode==='custom'){
    f.style.width='100%';
    f.style.height='100%';
    f.style.left='0';
    f.style.top='0';
    f.style.transform='none';

    const sourceName=document.getElementById('source-name-'+key);
    if(sourceName && c.url){
      sourceName.href=c.url;
    }

    return;
  }

  if(
    f.tagName === 'IFRAME' &&
    c.url
  ){
    const rawFrameUrl=(c.facebookVideoEmbed===true)
      ? facebookLiveEmbedUrlV101(c.url)
      : c.url;
    const embedUrl=iframeEmbedUrlV142(rawFrameUrl,false);
    const isYoutube=isYouTubeUrlV142(rawFrameUrl);

    f.classList.toggle('youtube-frame-v142',isYoutube);

    if(f.getAttribute('src')!==embedUrl){
      f.setAttribute('src',embedUrl);
    }

    const urlInput=document.getElementById('iframe-url-'+key);
    if(urlInput && urlInput.value!==c.url){
      urlInput.value=c.url;
    }

    if(isYoutube){
      f.style.width='100%';
      f.style.height='100%';
      f.style.left='0';
      f.style.top='0';
      f.style.transform='none';

      const sourceName=document.getElementById('source-name-'+key);
      if(sourceName) sourceName.href=c.url;
      return;
    }
  }

  if(
    f.tagName === 'IMG' &&
    c.stockPreview===true &&
    c.url
  ){
    const previewUrl=stockPreviewUrlV121(key,c.url);

    // ถ้ามีภาพอยู่แล้ว อย่าเปลี่ยน src ทันที
    // ให้ preload ก่อนแล้วค่อยสลับ เพื่อไม่ให้ผู้ชมเห็นสถานะโหลด
    if(
      !f.getAttribute('src') ||
      f.getAttribute('src')===''
    ){
      f.setAttribute('src',previewUrl);
    }else if(
      f.getAttribute('src')!==previewUrl
    ){
      refreshOneStockPreviewV126(key);
    }
  }

  const sourceName=document.getElementById('source-name-'+key);
  if(sourceName && c.url){
    sourceName.href=c.url;
  }

  f.style.width = c.w + 'px';
  f.style.left = c.left + 'px';
  f.style.top = c.top + 'px';
  f.style.transform = 'scale(' + c.scale + ')';

  if(f.tagName === 'IFRAME'){
    f.style.height = c.h + 'px';
  }else if(f.classList.contains('frame-custom')){
    f.style.height = c.h + 'px';
  }else if(
    f.tagName === 'IMG' &&
    c.stockPreview===true
  ){
    // Screenshot service คืน 1200x1200 คงที่
    // ล็อกไว้เพื่อไม่ให้กล่องแดง/เขียวเลื่อนตอน refresh
    f.style.height = '1200px';
  }else{
    f.style.height = 'auto';
  }
}

function clampMediaDockV142(){
  const dock=document.getElementById('mediaDockV142');
  if(!dock || dock.classList.contains('hidden')) return;
  if(!dock.style.left || !dock.style.top) return;

  const rect=dock.getBoundingClientRect();
  const maxLeft=Math.max(0,window.innerWidth-rect.width);
  const maxTop=Math.max(0,window.innerHeight-rect.height);
  const left=Math.max(0,Math.min(maxLeft,parseFloat(dock.style.left)||0));
  const top=Math.max(0,Math.min(maxTop,parseFloat(dock.style.top)||0));
  dock.style.left=left+'px';
  dock.style.top=top+'px';
}

(function initMediaDockV142(){
  let drag=null;

  document.addEventListener('pointerdown',function(ev){
    const head=ev.target.closest && ev.target.closest('#mediaDockHeadV142');
    if(!head) return;
    if(ev.target.closest('button')) return;

    const dock=document.getElementById('mediaDockV142');
    if(!dock || dock.classList.contains('hidden')) return;

    const rect=dock.getBoundingClientRect();
    dock.style.left=rect.left+'px';
    dock.style.top=rect.top+'px';
    dock.style.right='auto';
    dock.style.bottom='auto';

    drag={
      pointerId:ev.pointerId,
      dx:ev.clientX-rect.left,
      dy:ev.clientY-rect.top
    };

    try{head.setPointerCapture(ev.pointerId)}catch(e){}
    ev.preventDefault();
  });

  document.addEventListener('pointermove',function(ev){
    if(!drag || ev.pointerId!==drag.pointerId) return;
    const dock=document.getElementById('mediaDockV142');
    if(!dock) return;

    const rect=dock.getBoundingClientRect();
    const maxLeft=Math.max(0,window.innerWidth-rect.width);
    const maxTop=Math.max(0,window.innerHeight-rect.height);
    const left=Math.max(0,Math.min(maxLeft,ev.clientX-drag.dx));
    const top=Math.max(0,Math.min(maxTop,ev.clientY-drag.dy));
    dock.style.left=left+'px';
    dock.style.top=top+'px';
    ev.preventDefault();
  },{passive:false});

  function endDrag(ev){
    if(!drag || ev.pointerId!==drag.pointerId) return;
    drag=null;
  }

  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',endDrag);
  window.addEventListener('resize',clampMediaDockV142);
  window.addEventListener('orientationchange',function(){setTimeout(clampMediaDockV142,100)});

  document.addEventListener('DOMContentLoaded',function(){
    const urlInput=document.getElementById('mediaDockUrlV142');
    if(urlInput){
      urlInput.addEventListener('keydown',function(ev){
        if(ev.key==='Enter'){
          ev.preventDefault();
          loadMediaDockUrlV142();
        }
      });
    }

    const size=localStorage.getItem('livehuay_media_size_v142');
    if(['small','medium','large'].includes(size||'')){
      const dock=document.getElementById('mediaDockV142');
      if(dock){
        dock.classList.remove('size-small','size-medium','size-large');
        dock.classList.add('size-'+size);
      }
    }

    const remembered=localStorage.getItem('livehuay_media_url_v142');
    const input=document.getElementById('mediaDockUrlV142');
    if(input && remembered) input.value=remembered;
  });
})();

function zoomFrame(key, d){ state[key].scale = Math.max(.05, Math.min(3.0, state[key].scale + d)); applyAll(key); }

function setZoom(key, scale){
  state[key].scale = Math.max(.05, Math.min(3.0, scale));

}

function moveBox(key, idx, dx, dy){
  const box = state[key].boxes[idx];
  if(!box) return;
  box.x += dx; box.y += dy; applyAll(key);
}
function resizeBox(key, idx, dw, dh){
  const box = state[key].boxes[idx];
  if(!box) return;
  box.w = Math.max(0, box.w + dw);
  box.h = Math.max(0, box.h + dh);
  applyAll(key);
}
function toggleSingleBox(key, idx){
  const box = state[key].boxes[idx];
  if(!box) return;
  if(box.w > 0 && box.h > 0){
    box._last = {w:box.w, h:box.h};
    box.w = 0; box.h = 0;
  }else{
    box.w = box._last?.w || 40;
    box.h = box._last?.h || 30;
  }
  applyAll(key);
}
function copyBox(key, idx){
  const box = state[key].boxes[idx];
  const txt = `x:${box.x}, y:${box.y}, w:${box.w}, h:${box.h}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).catch(()=>{});
  }
}
function saveCfg(key){
  const c=state[key];
  const payload={left:c.left,top:c.top,scale:c.scale,w:c.w,h:c.h,boxes:deepCopy(c.boxes),_layoutVersion:c.layoutVersion||1};
  if(c.mode==='iframe' && c.url){ payload.url=c.url; }
  showSaveStatus('กำลังบันทึก...',true);
  fetch('/api/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key,payload})})
    .then(r=>r.json()).then(()=>showSaveStatus('บันทึกแล้ว • ใช้ค่าเดียวกันทุกเครื่อง',true))
    .catch(function(err){showSaveStatus('บันทึกไม่สำเร็จ',false);console.error(err);});
}

function resetCfg(key){
  const original=ITEMS.find(x=>x.key===key); state[key]=deepCopy(original); applyAll(key);

function formatMarketNumber(v){
  const n = Number(v);
  if(!Number.isFinite(n)) return '--';

  return n.toLocaleString('en-US',{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function formatSigned(v){
  const n = Number(v);
  if(!Number.isFinite(n)) return '--';

  return (n >= 0 ? '+' : '') +
    n.toLocaleString('en-US',{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });
}

const STOCK_RESULT_DELAY_MINUTES_V112=2;

function stockResultKeyV112(key){

    'hsi','hsi_vip',

function drawTimeReached(key){
  const item = getItemByKey(key);
  if(!item || !item.draw) return true;

  const parts = String(item.draw).split(':');
  if(parts.length !== 2) return true;

  const hh = Number(parts[0]);
  const mm = Number(parts[1]);
  if(!Number.isFinite(hh) || !Number.isFinite(mm)) return true;

  const nowParts=
    new Intl.DateTimeFormat(
      'en-GB',
      {
        timeZone:'Asia/Bangkok',
        hour:'2-digit',
        minute:'2-digit',
        hourCycle:'h23'
      }
    ).formatToParts(new Date());

  const map=
    Object.fromEntries(
      nowParts.map(function(p){
        return [p.type,p.value];
      })
    );

  const nowMinutes=
    Number(map.hour)*60+
    Number(map.minute);

  let drawMinutes=
    hh*60+mm;

  if(stockResultKeyV112(key)){
    drawMinutes+=STOCK_RESULT_DELAY_MINUTES_V112;
  }

  // หวยรอบดึกหลังเที่ยงคืน
  if(item.nextDay){
    if(nowMinutes >= 12 * 60) return false;
    return nowMinutes >= drawMinutes;
  }

  // ก่อน 04:00 ยังเป็น operational day ของวันก่อน
  if(
    nowMinutes <
    OPERATIONAL_DAY_CUTOFF_MINUTES_V113 &&
    drawMinutes >=
      OPERATIONAL_DAY_CUTOFF_MINUTES_V113
  ){
    return true;
  }

  return nowMinutes >= drawMinutes;
}

const OPERATIONAL_DAY_CUTOFF_MINUTES_V113=240;

function bangkokDatePartsV113(){
  const parts=
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:'Asia/Bangkok',
        year:'numeric',
        month:'2-digit',
        day:'2-digit',
        hour:'2-digit',
        minute:'2-digit',
        hourCycle:'h23'
      }
    ).formatToParts(new Date());

  return Object.fromEntries(
    parts.map(function(p){
      return [p.type,p.value];
    })
  );
}

function addDateDaysV113(dateString,days){
  const m=
    String(dateString||'')
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);

  if(!m){
    return dateString;
  }

  const d=
    new Date(
      Date.UTC(
        Number(m[1]),
        Number(m[2])-1,
        Number(m[3])
      )
    );

  d.setUTCDate(
    d.getUTCDate()+Number(days||0)
  );

  return d.toISOString().slice(0,10);
}

function operationalDateKeyV113(){
  const p=bangkokDatePartsV113();

  const today=
    p.year+'-'+p.month+'-'+p.day;

  const nowMinutes=
    Number(p.hour)*60+
    Number(p.minute);

  if(
    nowMinutes <
    OPERATIONAL_DAY_CUTOFF_MINUTES_V113
  ){
    return addDateDaysV113(
      today,
      -1
    );
  }

  return today;
}

function expectedResultDateForKeyV113(key){
  const base=
    operationalDateKeyV113();

  const item=getItemByKey(key);

  if(
    currentBoard==='night' &&
    item &&
    item.nextDay
  ){
    return addDateDaysV113(
      base,
      1
    );
  }

  return base;
}

function rowMatchesOperationalDateV113(row){
  if(!row) return false;

  return (
    String(row.resultDate||'') ===
    expectedResultDateForKeyV113(
      String(row.key||'')

function bangkokTodayKeyV94(){

  const map =

  );
}

function updateMarketCard(key, row){
  if(!row) return;

  if(!drawTimeReached(key)){
    setWaitingResult(key);
  }else{
    clearWaitingResult(key);
  }

  const current = marketElement('market-current-' + key);
  const prev = marketElement('market-prev-' + key);
  const change = marketElement('market-change-' + key);
  const percent = marketElement('market-percent-' + key);
  const topResult = marketElement('result-' + key + '-top');
  const bottomResult = marketElement('result-' + key + '-bottom');
  const note = ensureMarketNote(key);

  // V109:
  // ถ้ามี Last/Prev.Close/Change แล้ว ให้แสดงทันที
  // แม้ผลหวยยัง pending เพื่อไม่ให้ค้าง "กำลังโหลด..."
  const currentNumber =
    Number(
      row.current ??
      row.last
    );

  const prevNumber =
    Number(
      row.previousClose ??
      row.prevClose ??
      row.previous_close
    );

  const changeNumber =
    Number(
      row.change
    );

  if(current){
    current.textContent =
      Number.isFinite(currentNumber)
        ? formatMarketNumber(currentNumber)
        : (
            row.error
              ? 'รอข้อมูล'
              : 'กำลังโหลด...'
          );
  }

  if(prev){
    prev.textContent =
      Number.isFinite(prevNumber)
        ? formatMarketNumber(prevNumber)
        : '--';
  }

  if(change){
    change.textContent =
      Number.isFinite(changeNumber)
        ? formatSigned(changeNumber)
        : '--';

    if(Number.isFinite(changeNumber)){
      change.style.color =
        changeNumber >= 0
          ? '#22c55e'
          : '#ffb7b7';
    }
  }

  if(percent){
    const pct=Number(row.percent);

    percent.textContent =
      Number.isFinite(pct)
        ? (
            (pct >= 0 ? '+' : '') +
            pct.toFixed(2) +
            '%'
          )
        : '--';

    if(Number.isFinite(pct)){
      percent.style.color =
        pct >= 0
          ? '#22c55e'
          : '';
    }
  }

  if(
    row.pending ||
    !rowIsTodayV94(row)
  ){
    if(topResult) topResult.textContent = '-';
    if(bottomResult) bottomResult.textContent = '-';

    if(note){
      note.textContent = 'รอผล';
      note.className = 'market-live-note';
    }
    return;
  }

  if(row.ok || row.stale){
    // AUTO RESULT RULES
    // นิเคอิเช้า: บน = Last 3 หลักท้าย / ล่าง = Change 2 หลักท้าย
    // จีนเช้า: บน = Last 3 หลักท้าย / ล่าง = Change 2 หลักท้าย
    // ฮั่งเส็งเช้า/บ่าย และหุ้น Yahoo อื่น ๆ: บน = Last 3 หลักท้าย / ล่าง = Change 2 หลักท้าย
    // ตัวอย่าง HSI Last 25,565.74 / Change -87.23 => 574 / 23
    // ตัวอย่าง Singapore Last 5,684.12 / Change -37.47 => 412 / 47
    if(canShowResult(key,row) && (
      key === 'nikkei' ||
      key === 'china' ||
      key === 'hsi' ||
      key === 'nikkei_pm' ||
      key === 'china_pm' ||
      key === 'hsi_pm' ||
      key === 'taiwan' ||
      key === 'korea' ||
      key === 'singapore'
    )){
      const lastDigits = Number.isFinite(Number(row.current))
        ? Math.abs(Number(row.current)).toFixed(2).replace(/\D/g,'')
        : '';

      const changeDigits = Number.isFinite(Number(row.change))
        ? Math.abs(Number(row.change)).toFixed(2).replace(/\D/g,'')
        : '';

      const topValue = lastDigits
        ? lastDigits.slice(-3).padStart(3,'0')
        : 'XXX';

      const bottomValue = changeDigits
        ? changeDigits.slice(-2).padStart(2,'0')
        : 'XX';

      if(canShowResult(key,row)){
        if(topResult) topResult.textContent = topValue;
        if(bottomResult) bottomResult.textContent = bottomValue;
      }else{
        if(topResult) topResult.textContent = '-';
        if(bottomResult) bottomResult.textContent = '-';
      }
    }else if(canShowResult(key,row)){
      if(canShowResult(key,row)){
        if(topResult && row.top !== undefined && row.top !== null){
          topResult.textContent = String(row.top).padStart(3,'0').slice(-3);
        }
        if(bottomResult && row.bottom !== undefined && row.bottom !== null){
          bottomResult.textContent = String(row.bottom).padStart(2,'0').slice(-2);
        }
      }else{
        if(topResult) topResult.textContent = '-';
        if(bottomResult) bottomResult.textContent = '-';
      }
    }

    if(note){
      note.textContent = row.stale ? 'ผลล่าสุด' : 'AUTO ผล';
      note.className = 'market-live-note' + (row.stale ? ' stale' : '');
    }
  }else{
    if(note){
      note.textContent = 'ERROR';
      note.className = 'market-live-note stale';
    }
  }
}

function normalizeVipResult(v, digits){
  if(v === null || v === undefined) return '-';
  const raw = String(v).trim();
  if(!raw || raw === '-' || raw === '--') return '-';
  const only = raw.replace(/\D/g,'');
  if(!only) return '-';
  if(digits && only.length > digits) return only.slice(-digits);
  return only;
}

function updateVipResult(key, row){
  const top = marketElement('result-' + key + '-top');
  const bottom = marketElement('result-' + key + '-bottom');
  const note = ensureMarketNote(key);

  function showVipWaiting(message='VIP รอผล'){
    if(top){
      top.textContent = '-';
      top.classList.add('waiting');
    }

    if(bottom){
      bottom.textContent = '-';
      bottom.classList.add('waiting');
    }

    if(note){
      note.textContent = message;
      note.className = 'market-live-note';
    }
  }

  if(!resultsVisible){
    showVipWaiting('VIP รอผล');
    return;
  }

  if(!drawTimeReached(key)){
    showVipWaiting('VIP รอผล');
    return;
  }

  const expectedDate =
    expectedResultDateForKeyV113(key);

  const resultDate =
    row && row.resultDate
      ? String(row.resultDate)
      : '';

  if(
    !row ||
    row.pending ||
    resultDate !== expectedDate
  ){
    showVipWaiting('VIP รอผล');
    return;
  }

  let topValue =
    row.top !== undefined &&
    row.top !== null &&
    String(row.top) !== ''
      ? normalizeVipResult(row.top,3)
      : '';

  let bottomValue =
    row.bottom !== undefined &&
    row.bottom !== null &&
    String(row.bottom) !== ''
      ? normalizeVipResult(row.bottom,2)
      : '';

  // V109:
  // ใช้สูตรเดียวกับ Singapore VIP เป็น fallback ทุก VIP
  // Last/Current -> 3 ตัวท้าย
  // Change -> 2 ตัวท้าย
  if(
    !topValue ||
    topValue==='-' ||
    !bottomValue ||
    bottomValue==='-'
  ){
    const currentNumber =
      Number(
        row.current ??
        row.last
      );

    const changeNumber =
      Number(
        row.change
      );

    if(
      Number.isFinite(currentNumber) &&
      Number.isFinite(changeNumber)
    ){
      const currentDigits =
        Math.abs(currentNumber)
          .toFixed(2)
          .replace(/\D/g,'');

      const changeDigits =
        Math.abs(changeNumber)
          .toFixed(2)
          .replace(/\D/g,'');

      topValue =
        currentDigits
          .slice(-3)
          .padStart(3,'0');

      bottomValue =
        changeDigits
          .slice(-2)
          .padStart(2,'0');
    }
  }

  if(!topValue || !bottomValue){
    showVipWaiting('VIP รอผล');
    return;
  }

  clearWaitingResult(key);

  if(top){
    top.textContent = topValue;
    top.classList.remove('waiting');
  }

  if(bottom){
    bottom.textContent = bottomValue;
    bottom.classList.remove('waiting');
  }

  if(note){
    note.textContent =
      row.manual
        ? 'VIP ผลหลังบ้าน'
        : 'VIP AUTO';

    note.className =
      'market-live-note' +
      (row.stale ? ' stale' : '');
  }
}


function laoDevelopmentResultV136(row){
  row=row||{};

  const clean=function(value,length){
    const raw=String(value??'').replace(/\D/g,'');
    return raw ? raw.padStart(length,'0').slice(-length) : '';
  };

  let four=clean(
    row.fourDigitResult ??
    row.fourDigit ??
    row.four ??
    row.result4,
    4
  );

  let top=clean(row.top,3);
  let bottom=clean(row.bottom,2);

  // ถ้ามีผล 4 ตัว ให้เป็นข้อมูลหลัก
  // 1234 => 3 ตัวบน 234 / 2 ตัวล่าง 12
  if(four){
    top=four.slice(-3);
    bottom=four.slice(0,2);
  }

  // รองรับข้อมูลเดิมที่เก็บไว้เป็น 3 ตัวบน + 2 ตัวล่าง
  // เช่น 234 + 12 สามารถย้อนกลับเป็น 1234 ได้
  if(!four && top.length===3 && bottom.length===2 && bottom.slice(-1)===top.slice(0,1)){
    four=bottom.slice(0,1)+top;
  }

  return {four,top,bottom};
}

        Number.isFinite(Number(row.last))
      );

    const hasResult=
      row &&
      !row.pending &&
      rowIsTodayV94(row) &&
      row.top &&
      row.bottom;

    if(hasResult || hasMarketData){
      return;
    }

    const now=Date.now();
    const last=
      Number(
        stockRecoveryLastV109[key] || 0
      );

    // ฝั่ง browser ขอ recovery ไม่เกิน key ละ 30 วินาที
    if(now-last < 30000){
      return;
    }

    stockRecoveryLastV109[key]=now;

    fetch(
      '/api/live-sync?key=' +
      encodeURIComponent(key),
      {
        cache:'no-store'
      }
    )
    .then(function(r){
      return r.json();
    })
    .then(function(){

        refreshMarketCards,
        1200
      );
    })
    .catch(function(err){
      console.error(
        'stock recovery',
        key,
        err
      );
    });
  });
}



function sharedVipRowV110(key,results){
  if(!results) return null;

  const peers={
    nikkei_vip:[
      'nikkei_vip',
      'nikkei_pm_vip'
    ],
    nikkei_pm_vip:[
      'nikkei_vip',
      'nikkei_pm_vip'
    ],
    hsi_vip:[
      'hsi_vip',
      'hsi_pm_vip'
    ],
    hsi_pm_vip:[
      'hsi_vip',
      'hsi_pm_vip'
    ],
    china_vip:[
      'china_vip'
    ]
  };

  const keys=
    peers[key] || [key];

  const candidates=
    keys
      .map(function(k){
        return results[k];
      })
      .filter(function(row){
        return !!(
          row &&
          row.ok &&
          !row.pending &&
          row.top &&
          row.bottom &&
          rowIsTodayV94(row)
        );
      });

  if(!candidates.length){
    return results[key] || null;
  }

  candidates.sort(function(a,b){
    const ta=
      Date.parse(
        a.fetchedAt ||
        a.repairedAt ||
        ''
      ) || 0;

    const tb=
      Date.parse(
        b.fetchedAt ||
        b.repairedAt ||
        ''
      ) || 0;

    return tb-ta;
  });

  return candidates[0];
}

function bangkokMinuteNowV95(){
  const parts=
    new Intl.DateTimeFormat(
      'en-GB',
      {
        timeZone:'Asia/Bangkok',
        hour:'2-digit',
        minute:'2-digit',
        hourCycle:'h23'
      }
    ).formatToParts(new Date());

  const m=
    Object.fromEntries(
      parts.map(function(p){
        return [p.type,p.value];
      })
    );

  return (
    Number(m.hour)*60 +
    Number(m.minute)
  );
}

function drawDiffMinutesV95(draw){
  const p=
    String(draw||'')
      .split(':')
      .map(Number);

  const drawMin=
    Number(p[0]||0)*60 +
    Number(p[1]||0);

  let diff=
    bangkokMinuteNowV95()-
    drawMin;

  if(diff < -720){
    diff+=1440;
  }

  return diff;
}

        vy:14+z*30,sw:rnd(.3,1),swA:rnd(8,26),ph:rnd(0,6.28),sp:rnd(1.2,3.2)*(Math.random()<.5?-1:1),
        tilt:rnd(-.5,.5),tv:rnd(-.25,.25),a:.22+z*.5,face:Math.random()<.7?0:1,t:rnd(0,10)};
    }
    function resize(){
      DPR=Math.min(window.devicePixelRatio||1,1.5);
      W=window.innerWidth;H=window.innerHeight;
      cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);
      var n=Math.max(8,Math.min(26,Math.round(W*H/62000)));
      while(coins.length<n)coins.push(newCoin(false));
      coins.length=n;
      var m=Math.max(10,Math.min(34,Math.round(W*H/42000)));
      stars=[];for(var i=0;i<m;i++)stars.push({x:rnd(0,W),y:rnd(0,H),s:rnd(1.5,5),p:rnd(0,6.28),v:rnd(.6,1.8)});
    }
    function drawCoin(x,y,r,ph,tilt,a,face){
      var c=Math.cos(ph),sx=Math.max(.06,Math.abs(c)),th=r*.16*Math.sin(ph);
      ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.globalAlpha=a;
      ctx.drawImage(edge,-r*sx+th,-r,r*2*sx,r*2);
      ctx.drawImage(faces[c>=0?face:1-face],-r*sx,-r,r*2*sx,r*2);
      if(sx>.75){ctx.globalAlpha=a*(sx-.75)*2.2;ctx.fillStyle='#fff';
        ctx.beginPath();ctx.ellipse(-r*.3*sx,-r*.38,r*.26*sx,r*.12,-.6,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
    function drawStar(x,y,s,a){
      ctx.globalAlpha=a;ctx.fillStyle='#ffe9a6';
      ctx.beginPath();
      ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);
      ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill();
    }
    function frame(dt,now){
      ctx.clearRect(0,0,W,H);
      var i,o;
      for(i=0;i<stars.length;i++){o=stars[i];
        drawStar(o.x,o.y,o.s,.15+.55*Math.abs(Math.sin(o.p+now*.001*o.v)));}
      for(i=0;i<coins.length;i++){o=coins[i];
        o.t+=dt;o.y+=o.vy*dt;o.ph+=o.sp*dt;o.tilt+=o.tv*dt;
        if(o.y-o.r>H){coins[i]=o=newCoin(true);}
        drawCoin(o.x+Math.sin(o.t*o.sw)*o.swA,o.y,o.r,o.ph,o.tilt,o.a,o.face);}
      for(i=bursts.length-1;i>=0;i--){o=bursts[i];
        o.life-=dt;if(o.life<=0){bursts.splice(i,1);continue;}
        o.vy+=620*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.ph+=o.sp*dt;
        drawCoin(o.x,o.y,o.r,o.ph,o.ph*.3,Math.min(1,o.life*1.6),0);}
      ctx.globalAlpha=1;
    }
    var last=0,acc=0,running=false;
    function loop(now){
      if(!running)return;
      requestAnimationFrame(loop);
      var d=now-last;
      if(d<32)return;                             /* ~30fps ประหยัดเครื่องตอนไลฟ์ */
      last=now;frame(Math.min(d,80)/1000,now);
    }
    function start(){if(running||reduce||document.hidden)return;running=true;last=performance.now();requestAnimationFrame(loop);}
    function stop(){running=false;}
    window.addEventListener('resize',function(){resize();if(reduce)frame(0,0);});
    document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
    resize();
    if(reduce)frame(0,0);else start();
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){faces=[makeSprite('฿'),makeSprite('★')];});}

    /* ---------- เหรียญพุ่งตอนผลออก ---------- */
    function burstAt(el){
      if(reduce)return;
      var b=el.getBoundingClientRect();
      if(b.bottom<0||b.top>H)return;
      var cx=b.left+b.width/2,cy=b.top+b.height/2;
      for(var i=0;i<16;i++){
        var ang=rnd(-Math.PI*.95,-Math.PI*.05),sp=rnd(180,460);
        bursts.push({x:cx+rnd(-b.width*.3,b.width*.3),y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
          r:rnd(7,13),ph:rnd(0,6.28),sp:rnd(6,12),life:rnd(1.1,1.8)});
      }
    }

    var board=document.getElementById('board');
    if(board&&window.MutationObserver){
      var seen=new WeakMap(),lastIds='',enterTimer=0;
      var hasDigit=function(s){return /\d/.test(s||'');};
      var scan=function(){
        var ids=Array.prototype.map.call(board.children,function(c){return c.id;}).join(',');
        if(ids!==lastIds){
          lastIds=ids;
          board.classList.add('luxe-enter');
          clearTimeout(enterTimer);
          enterTimer=setTimeout(function(){board.classList.remove('luxe-enter');},1500);
        }
        var now=Date.now(),list=board.querySelectorAll('.result');
        for(var i=0;i<list.length;i++){
          var el=list[i],txt=el.textContent,rec=seen.get(el);
          if(!rec){seen.set(el,{t:now,v:txt});continue;}
          if(rec.v===txt)continue;
          var was=hasDigit(rec.v);rec.v=txt;
          /* เล่นเฉพาะตอนผลเพิ่งออกจริง ไม่เล่นตอนโหลดหน้า/สลับกระดาน */
          if(!was&&hasDigit(txt)&&now-rec.t>6000){
            el.classList.remove('luxe-pop');void el.offsetWidth;el.classList.add('luxe-pop');
            burstAt(el);
          }
        }
      };
      var pending=false;
      new MutationObserver(function(){
        if(pending)return;pending=true;
        requestAnimationFrame(function(){pending=false;scan();});
      }).observe(board,{childList:true,subtree:true,characterData:true});
      scan();
    }
  }catch(err){
    if(window.console)console.warn('[luxe-ui]',err);
  }
})();
</script>
<script id="dock-history-v155">
/* ===== V155: ประวัติเพลงที่เปิด + ซ่อนแบบหายไปเลย ===== */
(function(){
  'use strict';
  var KEY='livehuay_media_history_v155',MAX=30;
  var dock=document.getElementById('mediaDockV142');
  if(!dock) return;
  function read(){try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
  function write(a){try{localStorage.setItem(KEY,JSON.stringify(a.slice(0,MAX)));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
  function ytId(u){try{var y=youtubeInfoV142(u);return y&&(y.videoId||y.id||y.v)||'';}catch(e){return '';}}
  function ytIdFallback(u){var m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:'';}

  /* ---------- ปุ่มบนหัวเครื่องเล่น ---------- */
  var ctl=dock.querySelector('.media-dock-controls-v142');
  var minBtn=document.getElementById('mediaDockMinBtnV142');
  var histBtn=document.createElement('button');
  histBtn.type='button';histBtn.className='dock-hist-btn';histBtn.title='ประวัติเพลงที่เปิด';histBtn.textContent='🕘';
  var hideBtn=document.createElement('button');
  hideBtn.type='button';hideBtn.className='dock-hide-btn';hideBtn.title='ซ่อนให้หายไป (เสียงยังเล่นต่อ)';hideBtn.textContent='🙈';
  ctl.insertBefore(histBtn,ctl.firstChild);
  ctl.insertBefore(hideBtn,minBtn);

  /* ---------- แผงประวัติ ---------- */
  var panel=document.createElement('div');
  panel.className='dock-hist-v155';
  dock.insertBefore(panel,dock.querySelector('.media-dock-hint-v142'));

  function render(){
    var list=read(),cur=(document.getElementById('mediaDockUrlV142')||{}).value||'';
    if(!list.length){panel.innerHTML='<div class="dock-hist-empty-v155">ยังไม่มีประวัติ — เปิดเพลง/ลิงก์แล้วจะมาอยู่ที่นี่</div>';return;}
    panel.innerHTML=list.map(function(it,i){
      var id=ytIdFallback(it.url);
      var thumb=id?'<img loading="lazy" alt="" src="https://i.ytimg.com/vi/'+id+'/default.jpg">':'<span class="dock-hist-ico-v155">🌐</span>';
      return '<div class="dock-hist-row-v155'+(it.url===cur?' now':'')+'">'+
        '<button type="button" class="dock-hist-open-v155" data-i="'+i+'" title="'+esc(it.url)+'">'+thumb+
        '<span class="dock-hist-txt-v155"><b>'+esc(it.title||host(it.url))+'</b><small>'+esc(it.author||host(it.url))+'</small></span></button>'+
        '<button type="button" class="dock-hist-del-v155" data-d="'+i+'" title="ลบออกจากประวัติ">✕</button></div>';
    }).join('')+'<button type="button" class="dock-hist-clear-v155" data-clear="1">ล้างประวัติทั้งหมด</button>';
  }
  panel.addEventListener('click',function(ev){
    var t=ev.target.closest('button');if(!t)return;
    var list=read();
    if(t.dataset.i!==undefined){var it=list[+t.dataset.i];if(it)window.loadMediaDockUrlV142(it.url);}
    else if(t.dataset.d!==undefined){list.splice(+t.dataset.d,1);write(list);render();}
    else if(t.dataset.clear){if(confirm('ล้างประวัติเพลงทั้งหมด?')){write([]);render();}}
  });
  histBtn.addEventListener('click',function(){
    dock.classList.toggle('show-hist');
    if(dock.classList.contains('show-hist'))render();
  });

  /* ---------- บันทึกประวัติ (ครอบฟังก์ชันเปิดเพลงเดิม ไม่แก้ของเดิม) ---------- */
  var origLoad=window.loadMediaDockUrlV142;
  window.loadMediaDockUrlV142=function(forceUrl){
    var input=document.getElementById('mediaDockUrlV142');
    var url=String((typeof forceUrl==='string'&&forceUrl)||(input&&input.value)||'').trim();
    var r=origLoad.apply(this,arguments);
    if(/^https?:\/\//i.test(url)){
      var list=read(),old=list.filter(function(x){return x.url===url;})[0];
      list=list.filter(function(x){return x.url!==url;});
      var entry={url:url,title:old&&old.title||'',author:old&&old.author||'',t:Date.now()};
      list.unshift(entry);write(list);
      if(!entry.title&&ytIdFallback(url)){
        fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(url))
          .then(function(r){return r.ok?r.json():null;})
          .then(function(j){
            if(!j||!j.title)return;
            var l=read();l.forEach(function(x){if(x.url===url){x.title=j.title;x.author=j.author_name||'';}});write(l);
            if(dock.classList.contains('show-hist'))render();
          }).catch(function(){});
      }
      if(dock.classList.contains('show-hist'))render();
    }
    return r;
  };

  /* ---------- ซ่อนแบบหายไปเลย: เสียงยังเล่นต่อ เปิดกลับจากเมนู ---------- */
  var menuBtn=document.querySelector('#topMenu button[onclick*="showMediaDockV142"]');
  var menuLabel=menuBtn?menuBtn.textContent:'';
  function badge(on){
    if(!menuBtn)return;
    menuBtn.textContent=menuLabel;
    if(on){var s=document.createElement('span');s.className='dock-playing-badge-v155';s.textContent='กำลังเล่น';menuBtn.appendChild(s);}
  }
  hideBtn.addEventListener('click',function(){
    var f=document.getElementById('mediaDockFrameV142');
    if(!f||!f.src||f.src==='about:blank'||f.getAttribute('src')==='about:blank'){
      /* ยังไม่ได้เปิดอะไร = ซ่อนเฉย ๆ ไม่ต้องค้างเงียบ */
      dock.classList.add('hidden');return;
    }
    dock.classList.remove('show-hist');
    dock.classList.add('stealth');badge(true);
  });
  /* ลิงก์เริ่มต้น: เปิดเครื่องเล่นครั้งแรกของหน้า (ยังไม่มีเพลง) จะเล่นลิงก์นี้ */
  var DEFAULT_URL='https://www.youtube.com/watch?v=OKTgK6AUpmw&list=RDOKTgK6AUpmw&start_radio=1';
  var defInput=document.getElementById('mediaDockUrlV142');
  function setDefInput(){var i=document.getElementById('mediaDockUrlV142'),f=document.getElementById('mediaDockFrameV142');if(i&&(!f||!f.getAttribute('src')||f.getAttribute('src')==='about:blank'))i.value=DEFAULT_URL;}
  setDefInput();document.addEventListener('DOMContentLoaded',setDefInput);window.addEventListener('load',setDefInput);
  var origShow=window.showMediaDockV142;
  window.showMediaDockV142=function(url){
    dock.classList.remove('stealth');badge(false);
    var fr=document.getElementById('mediaDockFrameV142');
    var idle=!fr||!fr.getAttribute('src')||fr.getAttribute('src')==='about:blank';
    var r=origShow.apply(this,arguments);
    if(idle&&!url)window.loadMediaDockUrlV142(DEFAULT_URL);
    return r;
  };
  var origClose=window.closeMediaDockV142;
  window.closeMediaDockV142=function(){
    dock.classList.remove('stealth','show-hist');badge(false);
    return origClose.apply(this,arguments);
  };
})();
</script>
<script id="drawing-v156">
/* ===== V156: ช่วง 5 นาทีก่อนผลออก (จนถึงผลขึ้น หรือไม่เกิน 30 นาทีหลังเวลา) ===== */
(function(){
  'use strict';
  var BEFORE=5,AFTER=30;
  var fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  function nowSec(){
    if(typeof window.__luxeFakeSec==='number')return window.__luxeFakeSec;
    var p=fmt.formatToParts(new Date()),v={};p.forEach(function(x){v[x.type]=x.value;});
    return (+v.hour%24)*3600+(+v.minute)*60+(+v.second);
  }
  function tick(){
    try{
      var items=window.ITEMS||(typeof ITEMS!=='undefined'?ITEMS:null);
      if(!items)return;
      var now=nowSec();
      items.forEach(function(it){
        var m=/^(\d{1,2}):(\d{2})/.exec(it.draw||'');if(!m)return;
        var draw=(+m[1])*3600+(+m[2])*60;
        var d=((draw-now)%86400+86400)%86400;          /* วินาทีที่เหลือ */
        var inWin=d<=BEFORE*60 || (86400-d)<=AFTER*60;  /* ก่อน 5 นาที หรือเลยมาไม่เกิน 30 นาที */
        var card=document.getElementById('card-'+it.key);if(!card)return;
        var closed=card.classList.contains('stock-is-closed');
        card.querySelectorAll('.result').forEach(function(r){
          var empty=!/\d/.test(r.textContent||'');
          var on=inWin&&empty&&!closed;
          if(r.classList.contains('luxe-drawing')!==on)r.classList.toggle('luxe-drawing',on);
          if(on&&r.classList.contains('lao-result-four')!==r.classList.contains('luxe-big'))r.classList.toggle('luxe-big',r.classList.contains('lao-result-four'));
        });
      });
    }catch(e){}
  }
  setInterval(tick,1000);tick();
  window.__luxeDrawingTick=tick;
})();
</script>

<script id="guide-v157">
/* ===== V157 แนวทางหวย: วิ่ง / รูด / 2 ตัว / 3 ตัว (สุ่ม) — กรอบลอยลากได้ เปลี่ยนชื่อหวยได้ ตามรอบ =====
   เก็บทุกอย่างใน localStorage ของเครื่องนี้ ไม่แตะ iframe / ผลหวย / ตั้งค่าเซิร์ฟเวอร์ */
(function(){
  'use strict';
  var LS='livehuay_guide_v157';
  function load(){try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}}
  function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
  var S=load();S.names=S.names||{};S.sets=S.sets||{};if(S.auto===undefined)S.auto=true;

  function items(){try{return (typeof ITEMS!=='undefined'&&ITEMS)||[];}catch(e){return [];}}
  function bkk(){
    var p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})
      .formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
    return {date:p.year+'-'+p.month+'-'+p.day,min:(+p.hour%24)*60+(+p.minute),dmy:p.day+'/'+p.month+'/'+(+p.year+543)};
  }
  function mins(t){var m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):-1;}
  function nameOf(it){return S.names[it.key]||it.name||it.key;}
  /* หวยรอบถัดไป: เวลาออกผลยังไม่ผ่าน (เผื่อ 5 นาทีหลังออก) ถ้าผ่านหมดแล้วเอาตัวแรก */
  function nextItem(){
    var list=items().filter(function(i){return mins(i.draw)>=0;}),now=bkk().min,best=null;
    list.forEach(function(i){var d=mins(i.draw);if(d+5>=now&&(!best||d<mins(best.draw)))best=i;});
    return best||list.slice().sort(function(a,b){return mins(a.draw)-mins(b.draw);})[0]||items()[0];
  }
  function pad(n,l){n=String(n);while(n.length<l)n='0'+n;return n;}
  function ri(n){return Math.floor(Math.random()*n);}
  function uniq(n,gen){var out=[],g=0;while(out.length<n&&g++<500){var v=gen();if(out.indexOf(v)<0)out.push(v);}return out;}
  /* สร้างชุดแนวทาง: เลข 2/3 ตัวผูกกับเลขวิ่ง ให้ดูเป็นแนวเดียวกัน */
  function generate(){
    var run=uniq(2,function(){return String(ri(10));});
    var rood=run[0];
    var two=uniq(6,function(){var d=run[ri(2)],o=String(ri(10));return ri(2)?d+o:o+d;});
    var three=uniq(4,function(){var x=[run[ri(2)],String(ri(10)),String(ri(10))];
      for(var i=2;i>0;i--){var j=ri(i+1),t=x[i];x[i]=x[j];x[j]=t;}return x.join('');});
    return {run:run,rood:rood,two:two,three:three,t:Date.now()};
  }
  function setKey(it){return bkk().date+'|'+it.key;}
  function getSet(it,force){
    var k=setKey(it);
    if(force||!S.sets[k])S.sets[k]=generate();
    /* เก็บแค่ของ 3 วันล่าสุด */
    var today=new Date(bkk().date);Object.keys(S.sets).forEach(function(x){if(today-new Date(x.slice(0,10))>3*864e5)delete S.sets[x];});
    save();return S.sets[k];
  }

  /* ---------- UI ---------- */
  var box=document.createElement('div');box.id='guideV157';box.hidden=true;
  box.innerHTML='<div class="g-head"><span>🔮</span><span class="g-title">แนวทางหวย</span>'+
    '<button type="button" class="g-min" title="ย่อ/ขยาย">▁</button><button type="button" class="g-x" title="ปิด">✕</button></div>'+
    '<div class="g-body">'+
      '<div class="g-row"><select class="g-sel" title="เลือกหวย"></select>'+
      '<label class="g-auto" title="เปลี่ยนเป็นหวยรอบถัดไปให้เองเมื่อเลยเวลาออกผล"><input type="checkbox" class="g-autochk">ตามรอบ</label></div>'+
      '<div class="g-card">'+
        '<input class="g-name" maxlength="40" title="แตะเพื่อเปลี่ยนชื่อหวย" spellcheck="false">'+
        '<div class="g-round"></div>'+
        '<div class="g-sec"><div class="g-lab">วิ่ง</div><div class="g-nums g-run"></div></div>'+
        '<div class="g-sec"><div class="g-lab">รูด</div><div class="g-nums g-rood"></div></div>'+
        '<div class="g-sec"><div class="g-lab">2 ตัว</div><div class="g-nums g-two"></div></div>'+
        '<div class="g-sec"><div class="g-lab">3 ตัว</div><div class="g-nums g-three"></div></div>'+
      '</div>'+
      '<div class="g-btns"><button type="button" class="g-roll" title="สุ่ม" aria-label="สุ่ม">🎲</button></div>'+
      
    '</div>';
  document.body.appendChild(box);
  var $=function(s){return box.querySelector(s);};
  var sel=$('.g-sel'),nameIn=$('.g-name'),autoChk=$('.g-autochk');
  autoChk.checked=!!S.auto;
  var cur=null;

  function nums(arr,cls){return arr.map(function(n){return '<span class="g-n'+(cls?' '+cls:'')+'">'+n+'</span>';}).join('');}
  function fillSelect(){
    var list=items(),v=cur&&cur.key;
    sel.innerHTML=list.map(function(i){return '<option value="'+i.key+'">'+(i.draw?i.draw+' • ':'')+nameOf(i).replace(/</g,'&lt;')+'</option>';}).join('');
    if(v&&list.some(function(i){return i.key===v;}))sel.value=v;
  }
  function render(set){
    if(!cur)return;
    if(document.activeElement!==nameIn)nameIn.value=nameOf(cur);
    $('.g-title').textContent='แนวทาง • '+nameOf(cur);
    $('.g-round').textContent='งวดวันที่ '+bkk().dmy+(cur.draw?' • ออกผล '+cur.draw+' น.':'');
    set=set||getSet(cur);
    $('.g-run').innerHTML=nums(set.run,'big red');
    $('.g-rood').innerHTML=nums([set.rood],'big')+'<span class="g-sub">รูดหน้า '+set.rood+'0-'+set.rood+'9 • รูดหลัง 0'+set.rood+'-9'+set.rood+'</span>';
    $('.g-two').innerHTML=nums(set.two);
    $('.g-three').innerHTML=nums(set.three);
  }
  function pick(it){if(!it)return;cur=it;S.key=it.key;save();fillSelect();sel.value=it.key;render();}
  function pickInitial(){
    var list=items(),it=null;
    if(!S.auto&&S.key)it=list.filter(function(i){return i.key===S.key;})[0];
    pick(it||nextItem());
  }

  sel.addEventListener('change',function(){
    var it=items().filter(function(i){return i.key===sel.value;})[0];
    S.auto=false;autoChk.checked=false;pick(it);
  });
  autoChk.addEventListener('change',function(){S.auto=autoChk.checked;save();if(S.auto)pick(nextItem());});
  nameIn.addEventListener('input',function(){
    if(!cur)return;var v=nameIn.value.trim();
    if(v&&v!==cur.name)S.names[cur.key]=v;else delete S.names[cur.key];
    save();$('.g-title').textContent='แนวทาง • '+nameOf(cur);
    var o=sel.querySelector('option[value="'+cur.key+'"]');if(o)o.textContent=(cur.draw?cur.draw+' • ':'')+nameOf(cur);
  });
  nameIn.addEventListener('blur',function(){if(cur&&!nameIn.value.trim())nameIn.value=nameOf(cur);});
  nameIn.addEventListener('keydown',function(e){if(e.key==='Enter')nameIn.blur();});

  var rolling=false;
  $('.g-roll').addEventListener('click',function(){
    if(!cur||rolling)return;rolling=true;box.classList.add('rolling');
    var n=0,iv=setInterval(function(){render(generate());if(++n>=10){clearInterval(iv);box.classList.remove('rolling');rolling=false;render(getSet(cur,true));}},70);
  });
  $('.g-min').addEventListener('click',function(){box.classList.toggle('mini');S.mini=box.classList.contains('mini');save();clamp();});
  $('.g-x').addEventListener('click',function(){box.hidden=true;S.open=false;save();});

  /* ---------- ลาก ---------- */
  function clamp(){
    var r=box.getBoundingClientRect(),W=window.innerWidth,H=window.innerHeight;
    var x=Math.min(Math.max(4,r.left),Math.max(4,W-r.width-4)),y=Math.min(Math.max(4,r.top),Math.max(4,H-40));
    box.style.left=x+'px';box.style.top=y+'px';
  }
  var drag=null;
  $('.g-head').addEventListener('pointerdown',function(e){
    if(e.target.closest('button'))return;
    var r=box.getBoundingClientRect();drag={dx:e.clientX-r.left,dy:e.clientY-r.top,id:e.pointerId};
    box.classList.add('dragging');try{this.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();
  });
  $('.g-head').addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    box.style.left=(e.clientX-drag.dx)+'px';box.style.top=(e.clientY-drag.dy)+'px';clamp();
  });
  function end(e){if(!drag)return;drag=null;box.classList.remove('dragging');clamp();
    S.pos={x:parseInt(box.style.left,10),y:parseInt(box.style.top,10)};save();}
  $('.g-head').addEventListener('pointerup',end);$('.g-head').addEventListener('pointercancel',end);
  window.addEventListener('resize',function(){if(!box.hidden)clamp();});
  /* V158: แก้ชื่อ/สุ่มในแถบอื่น → แถบนี้อัปเดตตาม */
  window.addEventListener('storage',function(e){if(e.key!==LS)return;var n=load();S.names=n.names||{};S.sets=n.sets||{};S.auto=n.auto!==undefined?n.auto:S.auto;if(!S.auto||!cur){var k=n.key;var it=items().filter(function(i){return i.key===k;})[0];if(it&&!S.auto)cur=it;}autoChk.checked=!!S.auto;if(cur){fillSelect();sel.value=cur.key;render();}});

  window.showGuideV157=function(){
    box.hidden=false;S.open=true;save();
    if(S.pos){box.style.left=S.pos.x+'px';box.style.top=S.pos.y+'px';}
    else if(window.innerWidth<600){box.style.left='8px';box.style.top='90px';}
    box.classList.toggle('mini',!!S.mini);
    pickInitial();clamp();
  };

  /* สลับกระดาน → รายชื่อหวยเปลี่ยนตามรอบ */
  if(typeof window.goBoard==='function'){
    var og=window.goBoard;
    window.goBoard=function(){var r=og.apply(this,arguments);
      setTimeout(function(){if(!box.hidden){var k=cur&&cur.key;var it=items().filter(function(i){return i.key===k;})[0];
        if(S.auto||!it)pick(nextItem());else pick(it);}},50);return r;};
  }
  /* ตามรอบอัตโนมัติ: เช็คทุก 30 วิ */
  setInterval(function(){if(box.hidden||!S.auto||!cur)return;var n=nextItem();if(n&&n.key!==cur.key)pick(n);else render();},30000);

  /* เพิ่มปุ่มในเมนู */
  var anchor=document.querySelector('#topMenu button[onclick^="showMediaDockV142"]');
  if(anchor){var b=document.createElement('button');b.type='button';b.textContent='🔮 แนวทางหวย (สุ่ม)';
    b.addEventListener('click',function(){window.showGuideV157();if(typeof closeTopMenu==='function')closeTopMenu();});
    anchor.parentNode.insertBefore(b,anchor.nextSibling);}

  if(S.open)setTimeout(window.showGuideV157,300);
})();
</script>
<script id="tab-sync-v158">
/* ===== V158 ซิงก์ทุกแถบ: แก้/บันทึกที่แถบไหน แถบอื่นที่เปิดอยู่อัปเดตเอง =====
   - แถบในเบราว์เซอร์เดียวกัน: แจ้งทันทีผ่าน BroadcastChannel
   - คนละเบราว์เซอร์/คนละเครื่อง (เช่น OBS): เช็ค /api/settings ทุก 15 วิ
   อัปเดตเฉพาะหวยที่ค่าที่บันทึกเปลี่ยนจริง ไม่ทับงานที่กำลังปรับค้างในแถบนั้น */
(function(){
  'use strict';
  var bc=null;try{bc=new BroadcastChannel('livehuay_sync_v158');}catch(e){}
  var last=null,busy=false;
  function J(v){try{return JSON.stringify(v===undefined?null:v);}catch(e){return '';}}
  function snap(saved){var o={};Object.keys(saved||{}).forEach(function(k){o[k]=J(saved[k]);});return o;}
  function itemsNow(){try{return ITEMS||[];}catch(e){return [];}}

  function applyKey(item,saved){
    var key=item.key,s=saved[key];
    if(s&&(!item.layoutVersion||s._layoutVersion===item.layoutVersion)){
      state[key]=Object.assign({},deepCopy(item),s);
      if(!Array.isArray(state[key].boxes))state[key].boxes=deepCopy(item.boxes);
    }else{
      state[key]=deepCopy(item);
    }
    if(item.mirrorSettingsKey){
      var mu=String((saved[item.mirrorSettingsKey]||{}).liveUrl||'').trim();
      if(/^https?:\/\//i.test(mu))state[key].url=mu;
    }
    var su=(saved.market_live_urls_v129||{})[key];
    if(su&&/^https?:\/\//i.test(String(su)))state[key].url=String(su).trim();
    applyAll(key);
  }

  function sync(){
    if(busy||typeof serverLoaded==='undefined'||!serverLoaded)return;
    busy=true;
    fetch('/api/settings',{cache:'no-store'}).then(function(r){return r.json();}).then(function(res){
      var saved=(res&&res.settings)||{},now=snap(saved);
      if(!last){last=now;return;}
      var changed=function(k){return (now[k]||'')!==(last[k]||'');};
      var n=0;
      if(changed('site_theme')&&typeof applySiteThemeV112==='function'){applySiteThemeV112(saved.site_theme||{});n++;}
      if(changed('site_messages_v129')&&typeof applySiteMessagesV129==='function'){applySiteMessagesV129(saved.site_messages_v129||{});n++;}
      var urlsChanged=changed('market_live_urls_v129');
      itemsNow().forEach(function(item){
        if(changed(item.key)||urlsChanged||(item.mirrorSettingsKey&&changed(item.mirrorSettingsKey))){
          try{applyKey(item,saved);n++;}catch(e){console.warn('[sync]',item.key,e);}
        }
      });
      last=now;
      if(n&&typeof showSaveStatus==='function')showSaveStatus('อัปเดตจากแถบอื่นแล้ว',true);
    }).catch(function(){}).then(function(){busy=false;});
  }
  window.syncSettingsV158=sync;

  /* จับการบันทึก/รีเซ็ตในแถบนี้ → แจ้งแถบอื่น */
  var of=window.fetch;
  window.fetch=function(input,init){
    var p=of.apply(this,arguments);
    try{
      var url=typeof input==='string'?input:(input&&input.url)||'';
      var m=String((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
      if(/\/api\/settings/.test(url)&&m!=='GET'){
        p.then(function(r){if(r&&r.ok){
          /* แถบนี้รู้ค่าใหม่แล้ว: รีเฟรช snapshot เงียบ ๆ แล้วแจ้งแถบอื่น */
          setTimeout(function(){
            of('/api/settings',{cache:'no-store'}).then(function(x){return x.json();}).then(function(res){last=snap((res&&res.settings)||{});}).catch(function(){});
            if(bc)bc.postMessage({t:'settings',at:Date.now()});
            try{localStorage.setItem('livehuay_sync_v158',String(Date.now()));}catch(e){}
          },300);
        }}).catch(function(){});
      }
    }catch(e){}
    return p;
  };

  if(bc)bc.onmessage=function(e){if(e.data&&e.data.t==='settings')sync();};
  window.addEventListener('storage',function(e){if(e.key==='livehuay_sync_v158')sync();});
  /* สลับกระดาน → ตั้ง snapshot ใหม่ */
  if(typeof window.goBoard==='function'){var og=window.goBoard;window.goBoard=function(){var r=og.apply(this,arguments);last=null;setTimeout(sync,800);return r;};}
  setInterval(sync,15000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)sync();});
  /* snapshot แรกหลังโหลดค่าเสร็จ */
  var w=setInterval(function(){if(typeof serverLoaded!=='undefined'&&serverLoaded){clearInterval(w);sync();}},500);
})();
</script>
<script id="remote-recv-v159">
/* ===== V159 รีโมท: หน้าหลัก (หน้าไลฟ์) รับคำสั่งจากหน้า /remote/ =====
   เบราว์เซอร์เดียวกัน: ทันที (BroadcastChannel) • คนละเครื่อง: เช็ค /api/settings ทุก 4 วิ
   คำสั่งเก่าก่อนเปิดหน้าไม่ถูกเล่นซ้ำ */
(function(){
  'use strict';
  var KEY='remote_cmds_v159',done={},lastId=null,busy=false;
  var LOADED=Date.now()-1500;
  function setFlag(cur,want,fn){if(!!cur!==!!want&&typeof fn==='function')fn();}
  function run(c){
    if(!c||!c.id||done[c.id])return;done[c.id]=1;
    var v=c.v;
    try{
      switch(c.a){
        case 'board':goBoard(String(v));if(typeof closeTopMenu==='function')closeTopMenu();break;
        case 'results':setFlag(resultsVisible,v,toggleResults);break;
        case 'vip':setFlag(vipNoteVisible,v,toggleVipNote);break;
        case 'auto':setFlag(autoNoteVisible,v,toggleAutoNote);break;
        case 'boxes':setFlag(boxesVisible,v,toggleBoxes);break;
        case 'dock':
          /* V160: สั่งจากหลังบ้าน = เล่นเสียงอย่างเดียว ไม่โชว์กรอบบนหน้าไลฟ์ (เว้นแต่สั่ง show) */
          var dk=document.getElementById('mediaDockV142');
          if(v&&v.open===false){closeMediaDockV142();}
          else if(v&&v.show===true){if(dk){dk.classList.remove('stealth','hidden');}}
          else if(v&&v.show===false){if(dk)dk.classList.add('stealth');}
          else{
            if(v&&v.url)showMediaDockV142(v.url);else showMediaDockV142();
            if(dk){dk.classList.remove('show-hist');dk.classList.add('stealth');}
          }
          break;
        case 'guide':
          if(v==='close'){var g=document.getElementById('guideV157');if(g&&!g.hidden)g.querySelector('.g-x').click();}
          else if(typeof showGuideV157==='function'){
            var gb=document.getElementById('guideV157');if(!gb||gb.hidden)showGuideV157();
            if(v==='roll')gb.querySelector('.g-roll').click();
            if(v&&typeof v==='object'&&v.name!==undefined){var n=gb.querySelector('.g-name');n.value=String(v.name).slice(0,40);n.dispatchEvent(new Event('input'));n.blur();}
          }
          break;
        case 'voice':
          if(v==='on'||v==='off'){if(window.setVoiceOnV163)setVoiceOnV163(v==='on');}
          else if(v==='test'&&window.voiceSayV163)voiceSayV163('ทดสอบเสียงประกาศครับ ได้ยินชัดไหมครับพี่ๆ',true);
          break;
        case 'snapshots':refreshSnapshots();break;
        case 'reload':setTimeout(function(){location.reload();},300);break;
      }
    }catch(e){console.warn('[remote]',c,e);}
  }
  function handle(list,initial){
    list=(list||[]).filter(function(c){return c&&c.id;}).sort(function(a,b){return a.id<b.id?-1:1;});
    if(initial||lastId===null){
      /* คำสั่งที่ส่งก่อนเปิดหน้านี้ = ของเก่า ไม่เล่นซ้ำ; ที่ส่งหลังเปิดหน้า (ระหว่างรอโหลด) ให้ทำ */
      list.forEach(function(c){if(parseInt(c.id,10)<LOADED)done[c.id]=1;else run(c);});
      lastId=list.length?list[list.length-1].id:'';return;
    }
    list.forEach(function(c){if(c.id>lastId){run(c);lastId=c.id;}});
  }
  function poll(){
    if(busy)return;busy=true;
    fetch('/api/settings',{cache:'no-store'}).then(function(r){return r.json();})
      .then(function(res){var p=((res&&res.settings)||{})[KEY]||{};handle(p.list,lastId===null);})
      .catch(function(){}).then(function(){busy=false;});
  }
  try{var bc=new BroadcastChannel('livehuay_remote_v159');
    bc.onmessage=function(e){var c=e.data&&e.data.cmd;if(c){run(c);if(lastId!==null&&c.id>lastId)lastId=c.id;}};}catch(e){}
  poll();setInterval(poll,4000);
})();
</script>

<script id="voice-v163">
/* ===== V163 เสียงประกาศ: พูดตอนใกล้ออกผล และตอนผลออก =====
   ใช้เสียงอ่านของเบราว์เซอร์ (Web Speech) เลือกเสียงไทยที่เป็นธรรมชาติที่สุดที่เครื่องมี
   (Edge: Premwadee/Niwat Natural • Mac: Kanya/Narisa แบบ Premium/Enhanced) */
(function(){
  var LS='livehuay_voice_v163',DONE='livehuay_voice_done_v163';
  var S={on:false,lead:5,rate:1,voice:'',pre:'ใกล้เวลาออกผลแล้วครับพี่ๆ ใครกำลังรอ{name}อยู่ พิมพ์มาทักทายกันหน่อยครับ วันนี้ใครลุ้นเลขไหนกันบ้าง',
    post:'ผลหวย{name}ออกแล้ว ไหนใคร ถูกหวยบ้าง มาแชร์กันหน่อยครับ'};
  try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'));}catch(e){}
  var done={};try{done=JSON.parse(localStorage.getItem(DONE)||'{}');}catch(e){}
  function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
  function saveDone(){var cut=Date.now()-3*864e5;Object.keys(done).forEach(function(k){if(done[k]<cut)delete done[k];});try{localStorage.setItem(DONE,JSON.stringify(done));}catch(e){}}
  var synth=window.speechSynthesis;
  function bkk(){var p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
    return {date:p.year+'-'+p.month+'-'+p.day,sec:(+p.hour)*3600+(+p.minute)*60+(+p.second)};}
  function thVoices(){return synth?synth.getVoices().filter(function(v){return /^th/i.test(v.lang);}):[];}
  function score(v){var n=v.name;return (/natural|neural|premium|enhanced|online/i.test(n)?10:0)+(/premwadee|niwat|narisa/i.test(n)?5:0)+(/kanya/i.test(n)?2:0)+(v.localService?0:1);}
  function pickVoice(){var vs=thVoices();if(!vs.length)return null;
    var want=vs.find(function(v){return v.name===S.voice;});if(want)return want;
    return vs.slice().sort(function(a,b){return score(b)-score(a);})[0];}
  var toastT;function toast(t,ms){var el=document.getElementById('voiceToastV163');if(!el){el=document.createElement('div');el.id='voiceToastV163';document.body.appendChild(el);}
    el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},ms||4000);}
  /* คิวพูดทีละประโยค ไม่ซ้อนกัน */
  var q=[],busy=false;
  function say(text,force){if(!synth||(!S.on&&!force))return;q.push(text);pump();}
  function pump(){if(busy||!q.length)return;busy=true;var u=new SpeechSynthesisUtterance(q.shift());
    var v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang='th-TH';
    u.rate=Math.min(1.5,Math.max(.6,+S.rate||1));u.pitch=1;
    var fin=function(){busy=false;setTimeout(pump,700);};
    u.onend=fin;u.onerror=function(e){if(e&&e.error==='not-allowed')toast('แตะหน้าจอ 1 ครั้งเพื่อให้เว็บพูดได้',8000);fin();};
    synth.speak(u);}
  window.voiceSayV163=say;
  function names(list){var n=list.map(function(i){return i.name;});return n.length<2?n[0]:n.slice(0,-1).join(' ')+' และ'+n[n.length-1];}
  function fill(tpl,name){return String(tpl).split('{name}').join(name);}
  function items(){return (typeof ITEMS!=='undefined'&&Array.isArray(ITEMS))?ITEMS:[];}
  function hm(s){var p=String(s||'').split(':');return p.length===2?(+p[0])*3600+(+p[1])*60:NaN;}
  /* 1) ใกล้ออกผล: เหลือ lead นาทีก่อนเวลา draw (หวยที่ออกเวลาเดียวกันพูดรวมประโยคเดียว) */
  function checkPre(){
    if(!S.on)return;var t=bkk(),lead=(+S.lead||5)*60,groups={};
    items().forEach(function(it){var d=hm(it.draw);if(!isFinite(d)||!it.name)return;
      var left=d-t.sec;if(left<=0||left>lead)return;
      var k=t.date+'|pre|'+it.key;if(done[k])return;if(hasResult(it.key))return;
      done[k]=Date.now();(groups[it.draw]=groups[it.draw]||[]).push(it);});
    var any=false;Object.keys(groups).sort().forEach(function(dr){any=true;say(fill(S.pre,names(groups[dr])));});
    if(any)saveDone();}
  /* 2) ผลออก: ดูจากข้อมูล /api/results ที่หน้าเว็บโหลดอยู่แล้ว */
  var latest={},primed={};
  function okRow(r){return !!(r&&r.ok&&!r.pending&&((r.top&&r.bottom)||r.fourDigitResult));}
  function hasResult(key){var r=latest[key];return okRow(r)&&String(r.resultDate||'')===bkk().date;} /* ผลของเมื่อวานไม่นับ */
  function onResults(res){
    if(!res||typeof res!=='object')return;var t=bkk(),fresh=[];
    items().forEach(function(it){var r=res[it.key];latest[it.key]=r;if(!okRow(r))return;
      var d=hm(it.draw);if(isFinite(d)&&t.sec<d&&t.sec>d-12*3600)return; /* ยังไม่ถึงเวลาออก = ผลเก่า */
      var k=(r.resultDate||t.date)+'|post|'+it.key;if(done[k])return;done[k]=Date.now();
      /* ผลที่ขึ้นอยู่แล้วตอนเปิดหน้า ไม่พูดย้อนหลัง */
      if(primed[currentBoardKey()]&&S.on)fresh.push(it);});
    primed[currentBoardKey()]=true;
    fresh.forEach(function(it){say(fill(S.post,it.name));});saveDone();}
  function currentBoardKey(){return typeof currentBoard!=='undefined'?String(currentBoard):'';}
  var of=window.fetch;
  window.fetch=function(input,init){var p=of.apply(this,arguments);
    try{var url=typeof input==='string'?input:(input&&input.url)||'';
      if(url.indexOf('/api/results')>-1){p.then(function(r){r.clone().json().then(function(d){if(d&&d.results)onResults(d.results);}).catch(function(){});}).catch(function(){});}}catch(e){}
    return p;};
  /* เปลี่ยนกระดาน: ผลของกระดานใหม่ที่ขึ้นอยู่แล้วไม่ต้องพูด */
  if(typeof window.goBoard==='function'){var og=window.goBoard;window.goBoard=function(){var r=og.apply(this,arguments);latest={};primed={};return r;};}
  setInterval(checkPre,15000);setTimeout(checkPre,3000);

  /* ===== แผงตั้งค่า ===== */
  function panel(){var el=document.getElementById('voiceV163');if(el)return el;
    el=document.createElement('div');el.id='voiceV163';el.hidden=true;
    el.innerHTML='<h3>🔊 เสียงประกาศ<button class="v-x" title="ปิด">✕</button></h3>'+
      '<label><input type="checkbox" class="v-on"> เปิดเสียงประกาศ</label>'+
      '<label>เสียง <select class="v-voice"></select></label>'+
      '<label>พูดก่อนออกผล <input type="number" class="v-lead" min="1" max="30"> นาที</label>'+
      '<label>ความเร็ว <input type="number" class="v-rate" min="0.6" max="1.5" step="0.05"></label>'+
      '<div class="v-row"><button class="v-t1">▶️ ลองเสียงใกล้ออก</button><button class="v-t2">▶️ ลองเสียงผลออก</button></div>'+
      '<div class="v-note">เสียงไทยที่เป็นธรรมชาติที่สุด: เปิดเว็บด้วย Microsoft Edge แล้วเลือก Premwadee/Niwat (Natural) • ถ้าเว็บไม่พูด ให้แตะหน้าจอ 1 ครั้ง</div>';
    document.body.appendChild(el);
    var $=function(s){return el.querySelector(s);};
    $('.v-x').onclick=function(){el.hidden=true;};
    $('.v-on').onchange=function(){S.on=this.checked;save();if(S.on){primeNow();say('เปิดเสียงประกาศแล้วครับ');}else if(synth)synth.cancel();menuLabel();};
    $('.v-voice').onchange=function(){S.voice=this.value;save();};
    $('.v-lead').onchange=function(){S.lead=Math.min(30,Math.max(1,+this.value||5));this.value=S.lead;save();};
    $('.v-rate').onchange=function(){S.rate=Math.min(1.5,Math.max(.6,+this.value||1));this.value=S.rate;save();};
    $('.v-t1').onclick=function(){say(fill(S.pre,sampleName()),true);};
    $('.v-t2').onclick=function(){say(fill(S.post,sampleName()),true);};
    return el;}
  function primeNow(){/* เปิดเสียงตอนผลขึ้นอยู่แล้ว: ไม่พูดผลที่ออกไปก่อนหน้า */
    var t=bkk();items().forEach(function(it){var r=latest[it.key];if(okRow(r)){done[(r.resultDate||t.date)+'|post|'+it.key]=Date.now();}});saveDone();}
  function sampleName(){var it=items()[0];return it&&it.name?it.name:'ฮานอยปกติ';}
  function fillVoices(){var el=panel(),sel=el.querySelector('.v-voice'),vs=thVoices(),best=pickVoice();
    sel.innerHTML=vs.length?vs.map(function(v){return '<option'+(best&&v.name===best.name?' selected':'')+'>'+v.name.replace(/</g,'')+'</option>';}).join(''):'<option value="">(เครื่องนี้ไม่มีเสียงไทย)</option>';}
  window.showVoiceV163=function(){var el=panel();fillVoices();el.querySelector('.v-on').checked=!!S.on;el.querySelector('.v-lead').value=S.lead;el.querySelector('.v-rate').value=S.rate;el.hidden=false;};
  if(synth&&'onvoiceschanged' in synth)synth.addEventListener('voiceschanged',function(){if(!panel().hidden)fillVoices();});
  window.setVoiceOnV163=function(on){S.on=!!on;save();if(S.on)primeNow();else if(synth)synth.cancel();menuLabel();var el=document.getElementById('voiceV163');if(el)el.querySelector('.v-on').checked=S.on;};
  var mb;function menuLabel(){if(mb)mb.textContent='🔊 เสียงประกาศ ('+(S.on?'เปิด':'ปิด')+')';}
  var anchor=document.querySelector('#topMenu button[onclick^="showMediaDockV142"]');
  if(anchor){mb=document.createElement('button');mb.type='button';menuLabel();
    mb.addEventListener('click',function(){window.showVoiceV163();if(typeof closeTopMenu==='function')closeTopMenu();});
    anchor.parentNode.insertBefore(mb,anchor.nextSibling);}
  /* เปิดค้างไว้จากครั้งก่อน: เบราว์เซอร์ต้องการการแตะ 1 ครั้งก่อนพูดได้ */
  if(S.on&&navigator.userActivation&&!navigator.userActivation.hasBeenActive){
    setTimeout(function(){if(!navigator.userActivation.hasBeenActive)toast('🔊 เสียงประกาศเปิดอยู่ — แตะหน้าจอ 1 ครั้งเพื่อให้เว็บพูดได้',10000);},1500);}
})();
</script>
</body>
